      property="og:description"

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Raza Music supports MP3, MP4, M4A, and M4B files, including audiobooks. The supported format list is Apple's, not ours."
    />

    <title>Supported Formats — Raza Music</title>

    <link rel="icon" type="image/png" href="/assets/music/icon_web.png" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/components/nav.css" />
    <link rel="stylesheet" href="/components/footer.css" />
    <link rel="stylesheet" href="/components/hero-section.css" />
    <link rel="stylesheet" href="/components/info-card.css" />
    <link rel="stylesheet" href="/components/info-card-grid.css" />
    <link rel="stylesheet" href="/components/callout-box.css" />
    <link rel="stylesheet" href="/components/link-card.css" />

    <script src="/components/nav.js" defer></script>
    <script src="/components/footer.js" defer></script>
    <script src="/components/hero-section.js" defer></script>
    <script src="/components/info-card.js" defer></script>

    <script src="/components/callout-box.js" defer></script>
    <script src="/components/link-card.js" defer></script>
  </head>
  <body>
    <raza-nav app="music"></raza-nav>

    <hero-section
      eyebrow="Supported formats"
      heading="If your iPhone can play it, Raza Music can too."
      description="We use Apple's own frameworks to read and play your music. The supported format list is Apple's, not ours — which means it stays current automatically as Apple adds new formats."
    ></hero-section>

    <div class="content">
      <div class="content-body">
        <div class="section">
          <h2>Audio</h2>
          <p class="desc">Raza Music plays the formats your library is most likely already in — including audiobooks, not just songs.</p>

          <info-card-grid columns="2" class="featured label-mono">
            <info-card variant="blue" label=".mp3" heading="MP3" badge="Universal" description="The format that will outlive us all. Every ripper, every download, every decade of music."></info-card>
            <info-card variant="blue" label=".mp4 · .m4a" heading="MP4 / M4A" badge="iTunes default" description="Apple's native audio containers, typically carrying AAC or ALAC. The default for music purchased or ripped through Apple's own tools."></info-card>
          </info-card-grid>

          <span class="sub-label" style="margin-top: 20px">Also supported</span>
          <info-card-grid class="secondary label-mono">
            <info-card variant="alt" label=".m4b" heading="M4B" description="The audiobook variant of M4A, with chapter and bookmark support built into the container."></info-card>
          </info-card-grid>

          <callout-box heading="What about FLAC, WAV, or OGG?" style="margin-top: 20px">
            <p>Not currently supported. Raza Music is built around MP3, MP4, M4A, and M4B — the formats an Apple Music or iTunes library is already in.</p>
          </callout-box>
        </div>

        <div class="other-links">
          <link-card href="/music/index.html" label="Raza Music" heading="Overview" description="Back to the Raza Music home page"></link-card>
          <link-card href="/music/browse.html" label="Browsing" heading="Grid and list" description="See your whole library, by cover or by row"></link-card>
        </div>
      </div>
    </div>

    <raza-footer></raza-footer>
  </body>
</html>
